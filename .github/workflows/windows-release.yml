name: Windows release build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 35
    outputs:
      package: ${{ steps.version.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine build version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -cnotmatch '\Av(?:0|[1-9][0-9]{0,4})\.(?:0|[1-9][0-9]{0,4})\.(?:0|[1-9][0-9]{0,4})\z') {
              throw "Release tag must be vX.Y.Z: $env:GITHUB_REF_NAME"
            }
            git merge-base --is-ancestor HEAD refs/remotes/origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit on main.' }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "package=PzServerUi-v$version-win-x64.exe" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Test application logic
        run: dotnet run --project tests/PzServerUi.Application.Tests -c Release

      - name: Install .NET MAUI for Windows
        run: dotnet workload install maui-windows

      - name: Publish single-file Windows x64 EXE
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/New-WindowsRelease.ps1 -BuildVersion $env:BUILD_VERSION -OutputDirectory "$env:RUNNER_TEMP/packages"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: ${{ runner.temp }}/packages/${{ steps.version.outputs.package }}
          if-no-files-found: error

  release:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.package }}
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ needs.build.outputs.package }}
        run: |
          gh release create "$GITHUB_REF_NAME" "release/$PACKAGE_NAME" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "PZ Server UI $GITHUB_REF_NAME"
